[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-scene-agent"
version = "0.3.0"
description = "A self-configuring 'what should I do this weekend, where I live' agent for Claude: onboarding interview, taste profile, event scoring, digests, field notes and generated skills."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.18"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
lsa = "localscene_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
